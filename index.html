<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>블로그 콘텐츠 스튜디오 Pro</title>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #064E3B;
      --primary-subtle: #ECFDF5;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #475569;
      --border: #E2E8F0;
      --accent: #10B981;
      --accent-dark: #047857;
      --warning-bg: #FFFBEB;
      --warning-border: #FDE68A;
      --warning-text: #92400E;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      padding: 20px 14px 100px;
      line-height: 1.5;
    }
    .wrapper { max-width: 680px; margin: 0 auto; width: 100%; }

    .app-header { text-align: center; margin-bottom: 24px; padding: 0 8px; }
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ECFDF5;
      color: var(--primary-dark);
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #A7F3D0;
      margin-bottom: 8px;
    }
    .badge-live::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
    }
    .app-header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin: 0 0 6px;
      color: var(--text-main);
    }
    .app-header p { font-size: 13.5px; color: var(--text-sub); margin: 0; }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      margin-bottom: 18px;
    }
    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14.5px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text-main);
    }
    .step-tag {
      background: #F1F5F9;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
    }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .chip-btn {
      background: #F8FAFC;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .chip-btn.active {
      background: var(--primary-subtle);
      border-color: var(--primary);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .btn-action {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.2);
    }
    .btn-action:disabled {
      background: #CBD5E1;
      box-shadow: none;
      cursor: not-allowed;
    }

    .input-vertical-group { display: flex; flex-direction: column; gap: 10px; }
    .custom-input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14.5px;
      outline: none;
    }
    .custom-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12);
    }
    .btn-sub-action {
      background: #064E3B;
      color: #FFFFFF;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .trend-stream { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .feed-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #FFFFFF;
      cursor: pointer;
    }
    .feed-item:active { background: #F8FAFC; }
    .feed-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .feed-kw { font-size: 15px; font-weight: 800; color: var(--text-main); }
    .feed-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-dark);
      background: var(--primary-subtle);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .feed-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; line-height: 1.45; }
    .feed-qbox {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--warning-text);
    }
    .feed-qbox ul { margin: 4px 0 0; padding-left: 14px; }
    .feed-pick-text {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      text-align: right;
    }

    .title-selector { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .title-radio-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      background: #FFF;
    }
    .title-radio-card.active {
      border-color: var(--primary);
      background: var(--primary-subtle);
      font-weight: 700;
    }

    .visual-gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .visual-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #F8FAFC;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .visual-item.full-width {
      grid-column: span 2;
    }
    .visual-item canvas {
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .btn-dl-single {
      background: #064E3B;
      color: #fff;
      border: none;
      padding: 7px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .preview-box {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.8;
      max-height: 440px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-bottom: 14px;
      color: var(--text-main);
    }
    .btn-copy-done {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-copy-done:hover { background: var(--primary-dark); }

    .status-alert {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <header class="app-header">
    <div class="badge-live">LIVE SEARCH ENGINE</div>
    <h1>블로그 콘텐츠 스튜디오 Pro</h1>
    <p>실시간 구글 검색 기반 트렌드 발굴 & 카드뉴스 원고 생성</p>
  </header>

  <!-- STEP 0 -->
  <section class="section-card">
    <div class="card-title">
      <span class="step-tag">0단계</span>
      <span>실시간 팩트 트렌드 탐색</span>
    </div>

    <div class="chip-grid">
      <button class="chip-btn active" data-cat="경제·복지·지원금">📊 경제·복지·지원금</button>
      <button class="chip-btn" data-cat="생활·상식·절약">📋 생활·상식·절약</button>
      <button class="chip-btn" data-cat="재테크·부동산">💰 재테크·부동산</button>
      <button class="chip-btn" data-cat="전체 트렌드">🌐 종합 핫이슈</button>
    </div>

    <button class="btn-action" id="btn-fetch-trend">⚡ 실시간 핫이슈 5개 발굴</button>
    <div id="trend-msg" class="status-alert"></div>
    <div class="trend-stream" id="trend-list"></div>
  </section>

  <!-- STEP 1 -->
  <section class="section-card" id="step1-section">
    <div class="card-title">
      <span class="step-tag">1단계</span>
      <span>키워드 확정 및 제목 생성</span>
    </div>

    <div class="input-vertical-group">
      <input type="text" id="main-keyword" class="custom-input" placeholder="키워드 직접 입력 또는 위 카드 선택" />
      <button class="btn-sub-action" id="btn-make-titles">제목 5개 추천받기</button>
    </div>

    <div id="title-msg" class="status-alert"></div>
    <div class="title-selector" id="title-list"></div>
  </section>

  <!-- STEP 2 -->
  <section class="section-card" id="step2-section" style="display: none;">
    <div class="card-title">
      <span class="step-tag">2단계</span>
      <span>본문 & 카드뉴스 썸네일 제작</span>
    </div>

    <button class="btn-action" id="btn-make-article">✍️ 고품질 원고 & 썸네일 일괄 생성</button>
    <div id="article-msg" class="status-alert"></div>

    <div id="output-area" style="display: none; margin-top: 18px;">
      <div style="font-size:13.5px; font-weight:700; margin-bottom:8px;">🎨 생성된 커버 & 카드뉴스 (총 5장)</div>
      <div class="visual-gallery" id="canvas-gallery"></div>

      <div style="font-size:13.5px; font-weight:700; margin-bottom:8px;">📝 작성된 전문 원고 (복사 전용)</div>
      <div class="preview-box" id="article-text"></div>
      
      <button class="btn-copy-done" id="btn-copy-clipboard">📋 네이버 블로그 서식(HTML) 복사</button>
    </div>
  </section>
</div>

<script>
  const WORKER_URL = "https://blog-writer.yunsugil.workers.dev";

  let activeCategory = "경제·복지·지원금";
  let currentTitle = "";
  let currentQuestions = [];
  let rawArticleJson = null;

  const chipBtns = document.querySelectorAll('.chip-btn');
  const btnFetchTrend = document.getElementById('btn-fetch-trend');
  const trendMsg = document.getElementById('trend-msg');
  const trendList = document.getElementById('trend-list');

  const mainKeyword = document.getElementById('main-keyword');
  const btnMakeTitles = document.getElementById('btn-make-titles');
  const titleMsg = document.getElementById('title-msg');
  const titleList = document.getElementById('title-list');

  const step2Section = document.getElementById('step2-section');
  const btnMakeArticle = document.getElementById('btn-make-article');
  const articleMsg = document.getElementById('article-msg');
  const outputArea = document.getElementById('output-area');
  const canvasGallery = document.getElementById('canvas-gallery');
  const articleText = document.getElementById('article-text');
  const btnCopyClipboard = document.getElementById('btn-copy-clipboard');

  chipBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      chipBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.getAttribute('data-cat');
    });
  });

  btnFetchTrend.addEventListener('click', async () => {
    btnFetchTrend.disabled = true;
    trendMsg.style.color = "var(--primary)";
    trendMsg.innerText = "🔍 구글 실시간 검색 기반 최신 핫이슈 분석 중... (약 4~5초)";
    trendList.innerHTML = "";

    try {
      const res = await fetch(`${WORKER_URL}/api/recommend-trending-topics`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: activeCategory })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "조회 실패");

      renderTrends(data.topics);
      trendMsg.innerText = "";
    } catch (err) {
      trendMsg.style.color = "#EF4444";
      trendMsg.innerText = err.message;
    } finally {
      btnFetchTrend.disabled = false;
    }
  });

  function renderTrends(topics) {
    trendList.innerHTML = "";
    if (!topics || topics.length === 0) {
      trendList.innerHTML = "<p style='text-align:center;font-size:13px;'>조회된 결과가 없습니다.</p>";
      return;
    }

    topics.forEach((t, i) => {
      const card = document.createElement('div');
      card.className = "feed-item";
      const qList = (t.questions || []).map(q => `<li>${escapeHtml(q)}</li>`).join('');

      card.innerHTML = `
        <div class="feed-top">
          <span class="feed-kw">${i + 1}. ${escapeHtml(t.keyword)}</span>
          <span class="feed-tag">실시간 팩트</span>
        </div>
        <div class="feed-desc">${escapeHtml(t.whySelected)}</div>
        <div class="feed-qbox">
          <strong>🤔 이웃 핵심 질문:</strong>
          <ul>${qList}</ul>
        </div>
        <div class="feed-pick-text">👉 클릭하여 1단계 키워드로 반영</div>
      `;

      card.addEventListener('click', () => {
        mainKeyword.value = t.keyword;
        currentQuestions = t.questions || [];
        document.getElementById('step1-section').scrollIntoView({ behavior: 'smooth' });
        mainKeyword.focus();
      });

      trendList.appendChild(card);
    });
  }

  btnMakeTitles.addEventListener('click', async () => {
    const kw = mainKeyword.value.trim();
    if (!kw) return alert("키워드를 입력하거나 위 트렌드 카드를 선택하세요.");

    btnMakeTitles.disabled = true;
    titleMsg.style.color = "var(--primary)";
    titleMsg.innerText = "🔍 검색 의도에 맞춘 제목 5개 추출 중...";
    titleList.innerHTML = "";
    step2Section.style.display = "none";

    try {
      const res = await fetch(`${WORKER_URL}/api/generate-titles`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: activeCategory, keyword: kw })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "제목 생성 실패");

      renderTitles(data.titles);
      titleMsg.innerText = "";
      step2Section.style.display = "block";
    } catch (err) {
      titleMsg.style.color = "#EF4444";
      titleMsg.innerText = err.message;
    } finally {
      btnMakeTitles.disabled = false;
    }
  });

  function renderTitles(titles) {
    titleList.innerHTML = "";
    titles.forEach((item, idx) => {
      const label = document.createElement('label');
      label.className = `title-radio-card ${idx === 0 ? 'active' : ''}`;
      
      const radio = document.createElement('input');
      radio.type = "radio";
      radio.name = "title_pick";
      radio.value = item.title;
      if (idx === 0) {
        radio.checked = true;
        currentTitle = item.title;
      }

      radio.addEventListener('change', () => {
        document.querySelectorAll('.title-radio-card').forEach(el => el.classList.remove('active'));
        label.classList.add('active');
        currentTitle = item.title;
      });

      const span = document.createElement('span');
      span.innerText = item.title;

      label.appendChild(radio);
      label.appendChild(span);
      titleList.appendChild(label);
    });
  }

  btnMakeArticle.addEventListener('click', async () => {
    if (!currentTitle) return alert("제목을 먼저 선택해 주세요.");

    btnMakeArticle.disabled = true;
    articleMsg.style.color = "var(--primary)";
    articleMsg.innerText = "🔍 이웃 질문 답변 및 담백한 본문 집필 중... (약 6~10초)";
    outputArea.style.display = "none";

    try {
      const res = await fetch(`${WORKER_URL}/api/generate-article`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          category: activeCategory,
          keyword: mainKeyword.value.trim(),
          title: currentTitle,
          questions: currentQuestions
        })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "원고 생성 실패");

      rawArticleJson = data;
      renderArticle(data);
      renderVisualGallery(data);
      outputArea.style.display = "block";
      articleMsg.innerText = "";
    } catch (err) {
      articleMsg.style.color = "#EF4444";
      articleMsg.innerText = err.message;
    } finally {
      btnMakeArticle.disabled = false;
    }
  });

  function renderArticle(data) {
    const stripTags = (s) => (s || '').replace(/<[^>]*>/g, '').replace(/\*\*/g, '');

    let preview = `[📷 대표 썸네일 이미지 들어갈 자리]\n\n`;
    preview += `${stripTags(data.intro)}\n\n`;
    
    data.sections.forEach((sec, idx) => {
      preview += `■ ${sec.step}: ${sec.title}\n\n`;
      preview += `[📷 챕터 ${idx + 1} 요약 카드뉴스 이미지 들어갈 자리]\n\n`;
      preview += `${stripTags(sec.body)}\n\n`;

      if (sec.table && sec.table.rows && sec.table.rows.length > 0) {
        preview += `[📌 핵심 요약]\n`;
        sec.table.rows.forEach(r => {
          preview += `• ${stripTags(r[0])}: ${r.slice(1).map(c => stripTags(c)).join(' / ')}\n`;
        });
        preview += `\n`;
      }
    });

    preview += `${stripTags(data.outro)}\n\n`;
    preview += `📌 공식 출처: ${data.source}\n\n`;
    preview += `${data.tags.map(t => `#${t}`).join(' ')}`;
    articleText.innerText = preview;
  }

  // 총 5장 캔버스 렌더링 (16:9 와이드 타이틀 커버 1장 + 정사각형 대표 썸네일 1장 + 카드뉴스 3장)
  function renderVisualGallery(data) {
    canvasGallery.innerHTML = "";

    // 1. 네이버 블로그 제목 전용 16:9 와이드 커버 (1920x1080)
    const wideCanvas = create16x9WideCoverCanvas({
      badge: data.thumbnail?.badge || `${new Date().getFullYear()} 실생활 꿀팁`,
      title: data.thumbnail?.mainTitle || mainKeyword.value.trim(),
      sub: data.thumbnail?.subTitle || "핵심 요약 가이드"
    });
    appendCanvasToGallery(wideCanvas, "1. 블로그 제목 와이드 커버 (16:9)", true);

    // 2. 검색 목록용 정사각형 대표 썸네일 (1080x1080)
    const thumbCanvas = createCardCanvas({
      badge: data.thumbnail?.badge || `${new Date().getFullYear()} 실생활 꿀팁`,
      title: data.thumbnail?.mainTitle || mainKeyword.value.trim(),
      sub: data.thumbnail?.subTitle || "알아두면 유용한 핵심 가이드",
      bgColor: "#064E3B",
      titleColor: "#FFFFFF",
      subColor: "#A7F3D0",
      badgeBg: "#10B981",
      badgeColor: "#FFFFFF",
      accentLine: "#34D399",
      isBordered: false
    });
    appendCanvasToGallery(thumbCanvas, "2. 대표 썸네일 (본문 상단)");

    // 3. 챕터별 카드뉴스 3장 (1080x1080)
    const cardThemes = [
      {
        bgColor: "#F0FDF4",
        titleColor: "#064E3B",
        subColor: "#047857",
        badgeBg: "#D1FAE5",
        badgeColor: "#065F46",
        accentLine: "#10B981",
        isBordered: true,
        borderColor: "#A7F3D0"
      },
      {
        bgColor: "#ECFDF5",
        titleColor: "#134E4A",
        subColor: "#0F766E",
        badgeBg: "#CCFBF1",
        badgeColor: "#115E59",
        accentLine: "#14B8A6",
        isBordered: true,
        borderColor: "#99F6E4"
      },
      {
        bgColor: "#FFFBEB",
        titleColor: "#78350F",
        subColor: "#92400E",
        badgeBg: "#FEF3C7",
        badgeColor: "#854D0E",
        accentLine: "#F59E0B",
        isBordered: true,
        borderColor: "#FDE68A"
      }
    ];

    data.sections.forEach((sec, idx) => {
      const theme = cardThemes[idx % cardThemes.length];
      const cardCanvas = createCardCanvas({
        badge: sec.step,
        title: sec.cardHighlight,
        sub: sec.cardSubtext || sec.title,
        bgColor: theme.bgColor,
        titleColor: theme.titleColor,
        subColor: theme.subColor,
        badgeBg: theme.badgeBg,
        badgeColor: theme.badgeColor,
        accentLine: theme.accentLine,
        isBordered: theme.isBordered,
        borderColor: theme.borderColor
      });
      appendCanvasToGallery(cardCanvas, `카드뉴스 ${idx + 1}`);
    });
  }

  // 16:9 와이드 타이틀 커버 (1920x1080) 전용 캔버스 생성기
  function create16x9WideCoverCanvas({ badge, title, sub }) {
    const canvas = document.createElement('canvas');
    canvas.width = 1920;
    canvas.height = 1080;
    const ctx = canvas.getContext('2d');

    // 딥 포레스트 그라데이션 배경
    const grad = ctx.createLinearGradient(0, 0, 1920, 1080);
    grad.addColorStop(0, "#064E3B");
    grad.addColorStop(1, "#022C22");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1920, 1080);

    // 포인트 라이트 효과
    ctx.fillStyle = "#10B981";
    ctx.globalAlpha = 0.15;
    ctx.beginPath();
    ctx.arc(1600, 300, 500, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;

    // 상단 뱃지
    ctx.fillStyle = "#10B981";
    ctx.beginPath();
    ctx.roundRect(120, 160, 300, 70, 35);
    ctx.fill();

    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 32px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(badge, 270, 208);

    // 메인 제목
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "800 84px -apple-system, sans-serif";
    ctx.textAlign = "left";
    wrapText(ctx, title, 120, 440, 1680, 110);

    // 서브 카피
    ctx.fillStyle = "#A7F3D0";
    ctx.font = "600 42px -apple-system, sans-serif";
    wrapText(ctx, sub, 120, 840, 1680, 60);

    // 하단 라임 포인트 라인
    ctx.fillStyle = "#34D399";
    ctx.fillRect(120, 960, 1680, 12);

    return canvas;
  }

  // 정사각형 카드 (1080x1080) 생성기
  function createCardCanvas({ badge, title, sub, bgColor, titleColor, subColor, badgeBg, badgeColor, accentLine, isBordered = false, borderColor = "#E2E8F0" }) {
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1080;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, 1080, 1080);

    if (isBordered) {
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 16;
      ctx.strokeRect(8, 8, 1064, 1064);
    }

    ctx.fillStyle = badgeBg;
    ctx.beginPath();
    ctx.roundRect(80, 100, 280, 60, 30);
    ctx.fill();

    ctx.fillStyle = badgeColor;
    ctx.font = "bold 28px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(badge, 220, 142);

    ctx.fillStyle = titleColor;
    ctx.font = "800 68px -apple-system, sans-serif";
    ctx.textAlign = "left";
    wrapText(ctx, title, 80, 380, 920, 95);

    ctx.fillStyle = subColor;
    ctx.font = "600 36px -apple-system, sans-serif";
    wrapText(ctx, sub, 80, 860, 920, 52);

    ctx.fillStyle = accentLine;
    ctx.fillRect(80, 980, 920, 10);

    return canvas;
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = (text || '').split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
      let testLine = line + words[n] + ' ';
      let metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        ctx.fillText(line, x, y);
        line = words[n] + ' ';
        y += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, y);
  }

  function appendCanvasToGallery(canvas, labelText, isFullWidth = false) {
    const box = document.createElement('div');
    box.className = `visual-item ${isFullWidth ? 'full-width' : ''}`;
    
    const dlBtn = document.createElement('button');
    dlBtn.className = "btn-dl-single";
    dlBtn.innerText = `⬇️ ${labelText} 저장`;
    dlBtn.onclick = () => {
      const link = document.createElement('a');
      link.download = `${labelText}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    };

    box.appendChild(canvas);
    box.appendChild(dlBtn);
    canvasGallery.appendChild(box);
  }

  function safeHighlightHtml(str) {
    if (!str) return '';
    let safe = escapeHtml(str);
    safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong style="color: #064e3b; font-weight: 800;">$1</strong>');
    safe = safe.replace(/&lt;mark&gt;(.*?)&lt;\/mark&gt;/gi, '<span style="background-color: #d1fae5; padding: 2px 5px; border-radius: 4px; font-weight: 700; color: #065f46;">$1</span>');
    safe = safe.replace(/&lt;strong&gt;(.*?)&lt;\/strong&gt;/gi, '<strong style="color: #064e3b; font-weight: 800;">$1</strong>');
    return safe;
  }

  btnCopyClipboard.addEventListener('click', () => {
    if (!rawArticleJson) return;
    const d = rawArticleJson;

    let html = `
      <div style="font-family: 'Apple SD Gothic Neo', sans-serif; line-height: 1.85; color: #1e293b; max-width: 680px; margin: 0 auto;">
        
        <div style="background: #f0fdf4; border: 2px dashed #86efac; border-radius: 8px; padding: 14px; text-align: center; color: #166534; font-weight: 700; margin-bottom: 24px; font-size: 14px;">
          📷 [여기에 '대표 썸네일' 이미지를 첨부하세요]
        </div>

        <p style="font-size: 16px; color: #334155; margin-bottom: 28px; line-height: 1.8;">${safeHighlightHtml(d.intro)}</p>
    `;

    d.sections.forEach((sec, idx) => {
      html += `
        <h2 style="font-size: 19px; font-weight: 800; color: #064e3b; margin-top: 38px; margin-bottom: 14px; border-bottom: 2px solid #10b981; padding-bottom: 8px;">
          ${escapeHtml(sec.step)}. ${escapeHtml(sec.title)}
        </h2>

        <div style="background: #f0fdf4; border: 2px dashed #86efac; border-radius: 8px; padding: 12px; text-align: center; color: #166534; font-weight: 700; margin-bottom: 16px; font-size: 13.5px;">
          📷 [여기에 '카드뉴스 ${idx + 1}' 이미지를 첨부하세요]
        </div>
        
        <p style="font-size: 16px; color: #334155; margin-bottom: 20px; line-height: 1.8;">${safeHighlightHtml(sec.body)}</p>
      `;

      if (sec.table && sec.table.rows && sec.table.rows.length > 0) {
        html += `
          <div style="background: #f0fdf4; border-left: 4px solid #10b981; border-radius: 0 8px 8px 0; padding: 16px; margin: 24px 0;">
            <div style="font-weight: 800; color: #064e3b; font-size: 14.5px; margin-bottom: 10px;">
              📌 한눈에 보는 핵심 요약
            </div>
        `;
        sec.table.rows.forEach((r) => {
          const itemTitle = safeHighlightHtml(r[0]);
          const itemContent = r.slice(1).map(c => safeHighlightHtml(c)).join(' · ');
          html += `
            <div style="margin-bottom: 8px; font-size: 14px; line-height: 1.6;">
              <span style="background: #d1fae5; color: #065f46; font-weight: 700; padding: 2px 6px; border-radius: 4px; font-size: 12.5px; margin-right: 6px;">${itemTitle}</span>
              <span style="color: #1e3a8a; font-weight: 600;">${itemContent}</span>
            </div>
          `;
        });
        html += `</div>`;
      }
    });

    html += `
        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; margin-top: 40px;">
          <p style="font-size: 15.5px; color: #334155; margin: 0 0 12px; line-height: 1.7;">${safeHighlightHtml(d.outro)}</p>
          <p style="font-size: 13px; color: #64748b; margin: 0;">📌 공식 출처: <strong>${escapeHtml(d.source)}</strong></p>
        </div>
        
        <p style="font-size: 14.5px; color: #059669; margin-top: 28px; font-weight: 700; line-height: 1.6;">
          ${d.tags.map(t => `#${escapeHtml(t)}`).join(' ')}
        </p>
      </div>
    `;

    navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([articleText.innerText], { type: 'text/plain' })
      })
    ]).then(() => {
      alert("포레스트 테마가 적용된 네이버 블로그 서식이 복사되었습니다! 에디터에 붙여넣기(Ctrl+V) 하세요.");
    }).catch(() => {
      navigator.clipboard.writeText(articleText.innerText);
      alert("텍스트가 복사되었습니다.");
    });
  });

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
