<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 자동화 파이프라인</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #F4F6F8; color: #191F28; line-height: 1.6; padding: 24px 16px 80px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 540px; }
    
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .app-title { font-size: 21px; font-weight: 800; color: #191F28; letter-spacing: -0.5px; }
    .btn-nav-toggle { font-size: 13px; font-weight: 700; color: #3182F6; background: #E8F3FF; padding: 8px 14px; border-radius: 20px; border: none; cursor: pointer; }

    .pipeline-card { background: #FFFFFF; border-radius: 18px; padding: 20px 18px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.04); }
    .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .step-badge { font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 6px; background: #F2F4F6; color: #4E5968; }
    .step-badge.step-green { background: #E8F7EE; color: #15803D; }
    .step-badge.step-amber { background: #FEF3C7; color: #B45309; }
    .step-title { font-size: 15px; font-weight: 700; color: #333D4B; }

    .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .cat-chip { background: #FAFAFB; border: 1.5px solid #E5E8EB; border-radius: 12px; padding: 12px 10px; font-size: 13px; font-weight: 600; color: #4E5968; cursor: pointer; text-align: center; transition: all 0.15s ease; font-family: inherit; }
    .cat-chip:active { transform: scale(0.97); }
    .cat-chip.active { background: #E8F3FF !important; border-color: #3182F6 !important; color: #1B64DA !important; font-weight: 700 !important; }

    .form-input { width: 100%; height: 48px; border: 1.5px solid #E5E8EB; border-radius: 12px; padding: 0 14px; font-size: 14px; font-weight: 500; color: #191F28; background: #FAFAFB; outline: none; font-family: inherit; }
    .form-input:focus { background: #FFFFFF; border-color: #3182F6; box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.12); }
    .form-input[readonly] { background: #F2F4F6; color: #6B7684; }
    
    .btn-action { width: 100%; height: 48px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-family: inherit; }
    .btn-blue { background: #3182F6; color: #FFFFFF; box-shadow: 0 4px 10px rgba(49, 130, 246, 0.2); }
    .btn-blue:active { background: #1B64DA; transform: scale(0.98); }
    .btn-green { background: #10B981; color: #FFFFFF; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }
    .btn-green:active { background: #059669; transform: scale(0.98); }
    .btn-action:disabled { background: #E5E8EB; color: #8B95A1; box-shadow: none; cursor: not-allowed; }
    
    .topic-result-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .topic-card-item { background: #FAFAFB; border: 1.5px solid #E5E8EB; border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: 0.2s; }
    .topic-card-item:hover, .topic-card-item:active { background: #E8F3FF; border-color: #3182F6; }
    .topic-card-kw { font-size: 15px; font-weight: 700; color: #1B64DA; margin-bottom: 6px; }
    .topic-card-why { font-size: 13px; color: #333D4B; line-height: 1.5; margin-bottom: 8px; font-weight: 500; }
    .topic-q-box { background: #FFFFFF; border-radius: 8px; padding: 8px 12px; border: 1px solid #E5E8EB; }
    .topic-q-label { font-size: 11px; font-weight: 700; color: #6B7684; margin-bottom: 4px; }
    .topic-q-list { list-style: none; padding: 0; margin: 0; }
    .topic-q-list li { font-size: 12px; color: #4E5968; line-height: 1.4; position: relative; padding-left: 10px; }
    .topic-q-list li::before { content: "•"; position: absolute; left: 0; color: #3182F6; font-weight: bold; }
    
    .title-result-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .title-card-item { background: #FAFAFB; border: 1.5px solid #E5E8EB; border-radius: 10px; padding: 12px 14px; font-size: 13.5px; font-weight: 600; color: #333D4B; cursor: pointer; line-height: 1.4; transition: 0.15s; }
    .title-card-item:active { background: #E8F3FF; border-color: #3182F6; color: #1B64DA; }
    
    .result-box { background: #FFFFFF; border: 1.5px solid #E5E8EB; border-radius: 14px; padding: 20px 16px; font-size: 14.5px; line-height: 1.85; color: #191F28; max-height: 600px; overflow-y: auto; margin-top: 12px; }
    .btn-copy { background: #F2F4F6; border: none; color: #4E5968; font-size: 14px; font-weight: 700; height: 46px; border-radius: 12px; width: 100%; cursor: pointer; font-family: inherit; margin-bottom: 10px; }
    .btn-copy:active { background: #E5E8EB; }

    .img-gallery-title { font-size: 14px; font-weight: 700; color: #191F28; margin-bottom: 12px; }
    .img-gallery { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
    .img-card-wrap { background: #F8FAFC; border: 1px solid #E5E8EB; border-radius: 14px; padding: 12px; text-align: center; }
    .img-card-label { font-size: 12px; font-weight: 700; color: #4E5968; margin-bottom: 8px; text-align: left; }
    .card-canvas { width: 100%; max-width: 480px; aspect-ratio: 1/1; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); display: block; margin: 0 auto 10px; background: #FFFFFF; }
    .img-down-btn { display: block; width: 100%; background: #064E3B; color: #FFFFFF; border: none; padding: 11px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .img-down-btn:active { background: #04382A; }

    .filter-bar { display: flex; gap: 6px; margin-bottom: 16px; }
    .filter-btn { padding: 6px 14px; border: 1px solid #E5E8EB; background: #FFFFFF; border-radius: 20px; font-size: 13px; font-weight: 600; color: #4E5968; cursor: pointer; font-family: inherit; }
    .filter-btn.active { background: #3182F6; color: #FFFFFF; border-color: #3182F6; }
    .date-card { background: #FFFFFF; border-radius: 16px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.04); }
    .date-header { padding: 14px 18px; background: #FAFAFB; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F2F4F6; font-size: 14.5px; color: #333D4B; }
    .topic-list { list-style: none; }
    .topic-item { padding: 14px 18px; border-bottom: 1px solid #F2F4F6; }
    .topic-item:last-child { border-bottom: none; }
    .topic-main { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .topic-title { font-size: 14px; font-weight: 700; color: #191F28; display: flex; align-items: center; gap: 6px; flex: 1; }
    .topic-detail { display: none; margin-top: 10px; padding: 12px; background: #F8FAFC; border-radius: 10px; font-size: 12.5px; color: #4E5968; }
    .topic-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .btn-sm { padding: 6px 10px; font-size: 12px; font-weight: 600; border-radius: 6px; border: 1px solid #E5E8EB; background: #FFFFFF; cursor: pointer; font-family: inherit; color: #4E5968; }
    .btn-write { background: #3182F6; color: #FFFFFF; border-color: #3182F6; }
    .btn-delete { color: #DC2626; border-color: #FECACA; background: #FEF2F2; }
  </style>
</head>
<body>
  <div class="container">
    <header class="top-header">
      <h1 class="app-title" id="mainHeaderTitle">✍️ 포스팅 파이프라인</h1>
      <button type="button" class="btn-nav-toggle" id="btnToggleArchive" onclick="toggleArchiveView()">📚 주제 보관함</button>
    </header>

    <div id="pipelineView">
      <section class="pipeline-card">
        <div class="card-header">
          <span class="step-badge">STEP 0</span>
          <h2 class="step-title">실시간 트렌드 발굴</h2>
        </div>
        <div class="category-grid">
          <button type="button" class="cat-chip active" onclick="setCategory(this, '경제·복지·지원금')">💰 경제·복지·지원금</button>
          <button type="button" class="cat-chip" onclick="setCategory(this, '생활·교통·할인')">🚌 생활·교통·할인</button>
          <button type="button" class="cat-chip" onclick="setCategory(this, '청년·취업·육아')">👶 청년·취업·육아</button>
          <button type="button" class="cat-chip" onclick="setCategory(this, '부동산·금융·재테크')">📈 부동산·금융·재테크</button>
        </div>
        <button type="button" id="btnRecommend" class="btn-action btn-blue" onclick="recommendTopics()">🔍 실시간 주제 5개 발굴</button>
        <div id="topicsContainer" class="topic-result-list" style="display: none;"></div>
      </section>

      <section class="pipeline-card">
        <div class="card-header">
          <span class="step-badge">STEP 1</span>
          <h2 class="step-title">롱테일 제목 추출</h2>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <input type="text" id="keywordInput" class="form-input" placeholder="키워드를 직접 입력하거나 위에서 선택하세요">
          <button type="button" id="btnGenerateTitles" class="btn-action btn-blue" onclick="generateTitles()">💡 롱테일 제목 5개 뽑기</button>
        </div>
        <div id="titlesContainer" class="title-result-list" style="display: none;"></div>
      </section>

      <section class="pipeline-card">
        <div class="card-header">
          <span class="step-badge step-green">STEP 2</span>
          <h2 class="step-title">팩트체크 본문 & 카드뉴스 집필</h2>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <input type="text" id="selectedTitleInput" class="form-input" placeholder="위에서 제목을 선택하면 자동 입력됩니다" readonly>
          <button type="button" id="btnGenerateArticle" class="btn-action btn-green" onclick="generateArticle()">⚡ 팩트체크 본문 & 카드뉴스 생성</button>
        </div>
      </section>

      <section id="resultSection" class="pipeline-card" style="display: none;">
        <div class="card-header">
          <span class="step-badge step-amber">COMPLETE</span>
          <h2 class="step-title">완성된 카드 & 원고</h2>
        </div>
        <h3 class="img-gallery-title">🎨 생성된 카드 이미지 (개별 다운로드)</h3>
        <div id="cardGallery" class="img-gallery"></div>
        <hr style="border: none; border-top: 1px dashed #E5E8EB; margin: 20px 0;">
        <button type="button" id="btnCopyArticle" class="btn-copy" onclick="copyArticle()">📋 본문 전체 복사하기 (형광펜·서식·표 포함)</button>
        <div id="articleOutput" class="result-box"></div>
      </section>
    </div>

    <div id="archiveView" style="display: none;">
      <div class="filter-bar">
        <button class="filter-btn active" onclick="setArchiveFilter('all', this)">전체</button>
        <button class="filter-btn" onclick="setArchiveFilter('pending', this)">🟡 미작성</button>
        <button class="filter-btn" onclick="setArchiveFilter('completed', this)">🟢 작성완료</button>
      </div>
      <div id="archiveList"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://blog-writer.yunsugil.workers.dev";
    const STORAGE_KEY = 'blog_topic_archive';
    let selectedCategory = "경제·복지·지원금";
    let currentQuestions = [];
    let currentArchiveFilter = 'all';
    let isArchiveOpen = false;

    function getKoreaDate() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(new Date());
    }

    // 외래어 순화 및 네이버 에디터 서식 치환
    function toSafeHtml(str) {
      if (!str) return "";
      let esc = str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // 영문 단어 순화 방어
      esc = esc
        .replace(/\bdomestic\b/gi, '국내')
        .replace(/\btarget\b/gi, '대상')
        .replace(/\bbenefit\b/gi, '혜택');

      // 네이버 에디터 인라인 형광펜 & 볼드 치환
      esc = esc
        .replace(/&lt;mark&gt;/gi, '<span style="background-color:#FFF3B0;padding:2px 4px;border-radius:3px;font-weight:bold;color:#191F28;">')
        .replace(/&lt;\/mark&gt;/gi, '</span>')
        .replace(/&lt;strong&gt;/gi, '<strong style="font-weight:bold;color:#111827;">')
        .replace(/&lt;\/strong&gt;/gi, '</strong>')
        .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
        .replace(/\n/g, '<br>');

      return esc;
    }

    // 본문 빌더: 소제목 깔끔화 및 태그 10개 이상 '#' 자동 부착
    function buildArticleHtml(data, title) {
      let html = `<div id="naverPasteArea" style="font-family:'Pretendard',AppleSDGothicNeo,sans-serif;line-height:1.85;color:#191F28;">`;
      html += `<h2 style="font-size:20px;font-weight:bold;color:#111827;margin-bottom:16px;">${toSafeHtml(title)}</h2>`;
      html += `<p style="font-size:15px;margin-bottom:16px;">${toSafeHtml(data.intro)}</p>`;
      html += `<div style="background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:8px;padding:12px;text-align:center;color:#64748B;font-size:13px;margin:16px 0;">📸 [대표 썸네일 이미지 삽입 위치]</div>`;

      (data.sections || []).forEach((s, idx) => {
        html += `<h3 style="font-size:17px;font-weight:bold;color:#111827;margin:24px 0 12px;">■ ${toSafeHtml(s.title)}</h3>`;
        
        const highlightText = s.boxHighlight || s.cardHighlight;
        const tipText = s.boxTip || s.cardSubtext;

        if (highlightText) {
          html += `<div style="background-color:#F0FDF4;border-left:4px solid #10B981;border-radius:6px;padding:14px 16px;margin:14px 0;">`;
          html += `<div style="color:#064E3B;font-weight:bold;font-size:15px;">📌 ${toSafeHtml(highlightText)}</div>`;
          if (tipText) {
            html += `<div style="color:#047857;font-size:13px;margin-top:6px;">💡 Tip: ${toSafeHtml(tipText)}</div>`;
          }
          html += `</div>`;
        }

        html += `<p style="font-size:15px;margin-bottom:14px;">${toSafeHtml(s.body)}</p>`;

        if (s.table && Array.isArray(s.table.headers) && Array.isArray(s.table.rows)) {
          html += `<div style="width:100%;overflow-x:auto;margin:16px 0;">`;
          html += `<table style="width:100%;border-collapse:collapse;border:1px solid #D1D5DB;font-size:13.5px;text-align:center;background:#FFFFFF;">`;
          html += `<thead><tr>`;
          s.table.headers.forEach(h => {
            html += `<th style="background-color:#F3F4F6;color:#1F2937;font-weight:bold;padding:10px 8px;border:1px solid #D1D5DB;white-space:nowrap;">${toSafeHtml(h)}</th>`;
          });
          html += `</tr></thead><tbody>`;
          s.table.rows.forEach(row => {
            html += `<tr>`;
            row.forEach(cell => {
              html += `<td style="padding:10px 8px;border:1px solid #D1D5DB;color:#374151;">${toSafeHtml(String(cell))}</td>`;
            });
            html += `</tr>`;
          });
          html += `</tbody></table></div>`;
        }

        html += `<div style="background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:8px;padding:12px;text-align:center;color:#64748B;font-size:13px;margin:16px 0;">📸 [요약 카드 0${idx + 1} 이미지 삽입 위치]</div>`;
      });

      html += `<p style="font-size:15px;margin:20px 0 12px;">${toSafeHtml(data.outro)}</p>`;
      if (data.source) {
        html += `<p style="font-size:13.5px;color:#4B5563;margin-bottom:12px;"><strong>📌 공식 출처:</strong> ${toSafeHtml(data.source)}</p>`;
      }
      
      // 해시태그 10개 이상 포맷팅
      if (data.tags && data.tags.length) {
        const formattedTags = data.tags.map(t => {
          let clean = t.trim().replace(/^#+/, '');
          return `#${clean}`;
        }).join(' ');
        html += `<p style="font-size:14px;color:#2563EB;line-height:1.8;word-break:break-all;">${formattedTags}</p>`;
      }
      html += `</div>`;
      return html;
    }

    function buildPlainText(data, title) {
      let text = `[글 제목]\n${title}\n\n[도입부]\n${data.intro}\n\n📸 [대표 썸네일 이미지]\n\n`;
      (data.sections || []).forEach((s, idx) => {
        text += `■ ${s.title}\n\n`;
        const hl = s.boxHighlight || s.cardHighlight;
        if (hl) text += `📌 ${hl}\nTip: ${s.boxTip || s.cardSubtext || ''}\n\n`;
        text += `${s.body}\n\n`;
        if (s.table && s.table.headers) {
          text += `[${s.table.headers.join(' | ')}]\n`;
          s.table.rows.forEach(r => text += `${r.join(' | ')}\n`);
          text += `\n`;
        }
        text += `📸 [요약 카드 0${idx+1} 이미지]\n\n`;
      });
      text += `[마무리]\n${data.outro}\n\n출처: ${data.source || ''}\n`;
      if (data.tags && data.tags.length) {
        text += data.tags.map(t => `#${t.trim().replace(/^#+/, '')}`).join(' ');
      }
      return text;
    }

    function drawMultilineText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 5) {
      const words = text.split(' ');
      let line = '';
      let lines = [];
      for (let n = 0; n < words.length; n++) {
        const testLine = line + (line ? ' ' : '') + words[n];
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line);
          line = words[n];
        } else {
          line = testLine;
        }
      }
      lines.push(line);
      lines.slice(0, maxLines).forEach((l, idx) => {
        ctx.fillText(l, x, y + (idx * lineHeight));
      });
    }

    function drawPillBadge(ctx, text, x, y, bgColor, textColor) {
      ctx.font = 'bold 24px Pretendard, sans-serif';
      const textWidth = ctx.measureText(text).width;
      const padX = 24;
      const height = 48;
      const width = textWidth + (padX * 2);
      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, 24);
      ctx.fill();
      ctx.fillStyle = textColor;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x + padX, y + (height / 2));
      ctx.textBaseline = 'alphabetic';
    }

    // ==========================================
    // 1. 화사한 비비드 5종 썸네일 엔진 ('2026 꿀팁' 뱃지 제거)
    // ==========================================
    function renderThumbnailCanvas(canvas, thumbData) {
      canvas.width = 800;
      canvas.height = 800;
      const ctx = canvas.getContext('2d');

      const THEMES = [
        { name: 'vivid_green', bgTop: '#03C75A', bgBottom: '#009944', stripeColor: 'rgba(255, 255, 255, 0.12)', brandBg: '#006B2F' },
        { name: 'vivid_purple', bgTop: '#8B5CF6', bgBottom: '#6D28D9', stripeColor: 'rgba(255, 255, 255, 0.12)', brandBg: '#4C1D95' },
        { name: 'vivid_blue', bgTop: '#2563EB', bgBottom: '#1D4ED8', stripeColor: 'rgba(255, 255, 255, 0.12)', brandBg: '#1E3A8A' },
        { name: 'vivid_coral', bgTop: '#F43F5E', bgBottom: '#BE123C', stripeColor: 'rgba(255, 255, 255, 0.12)', brandBg: '#881337' },
        { name: 'vivid_gold', bgTop: '#F59E0B', bgBottom: '#B45309', stripeColor: 'rgba(255, 255, 255, 0.12)', brandBg: '#78350F' }
      ];

      const theme = THEMES[Math.floor(Math.random() * THEMES.length)];

      // 1. 배경 그라데이션
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 800);
      bgGrad.addColorStop(0, theme.bgTop);
      bgGrad.addColorStop(1, theme.bgBottom);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 800, 800);

      // 2. 세로 스트라이프
      const stripeWidth = 24;
      const stripeGap = 20;
      ctx.fillStyle = theme.stripeColor;
      for (let x = 30; x < 770; x += (stripeWidth + stripeGap)) {
        ctx.fillRect(x, 0, stripeWidth, 800);
      }

      // 3. 상단 '길노트' 시그니처 뱃지
      const logoY = 150;
      ctx.fillStyle = theme.brandBg;
      ctx.beginPath();
      ctx.arc(345, logoY, 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 22px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('G', 345, logoY);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 30px Pretendard, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('길노트', 376, logoY);

      // 4. 중앙 메인 타이틀 (볼드 화이트 폰트)
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 54px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';

      ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 3;

      const mainTitle = thumbData.mainTitle || '주요 정책 안내';
      const words = mainTitle.split(' ');
      let line = '';
      let lines = [];
      const maxTextWidth = 660;

      for (let n = 0; n < words.length; n++) {
        const testLine = line + (line ? ' ' : '') + words[n];
        if (ctx.measureText(testLine).width > maxTextWidth && n > 0) {
          lines.push(line);
          line = words[n];
        } else {
          line = testLine;
        }
      }
      lines.push(line);

      const displayLines = lines.slice(0, 3);
      const lineHeight = 76;
      const startY = 430 - ((displayLines.length - 1) * lineHeight / 2);

      displayLines.forEach((l, idx) => {
        ctx.fillText(l, 400, startY + (idx * lineHeight));
      });

      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // 5. 하단 부제
      const subTitle = thumbData.subTitle || '알아두면 유용한 가이드';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.font = '600 24px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(subTitle, 400, 650);

      // 6. 하단 포인트 바
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(360, 680, 80, 4);
    }

    // 챕터별 핵심 요약 카드 렌더링
    function renderSectionCanvas(canvas, secData, idx) {
      canvas.width = 800;
      canvas.height = 800;
      const ctx = canvas.getContext('2d');
      const THEMES = [
        { borderColor: '#A7F3D0', badgeBg: '#D1FAE5', badgeText: '#065F46', bodyColor: '#064E3B', subColor: '#047857', lineColor: '#10B981' },
        { borderColor: '#BAE6FD', badgeBg: '#E0F2FE', badgeText: '#0369A1', bodyColor: '#0C4A6E', subColor: '#0284C7', lineColor: '#0284C7' },
        { borderColor: '#FEF08A', badgeBg: '#FEF9C3', badgeText: '#854D0E', bodyColor: '#713F12', subColor: '#A16207', lineColor: '#EAB308' }
      ];
      const t = THEMES[idx % THEMES.length];
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 800, 800);
      ctx.strokeStyle = t.borderColor;
      ctx.lineWidth = 24;
      ctx.strokeRect(12, 12, 776, 776);

      drawPillBadge(ctx, '요약', 64, 90, t.badgeBg, t.badgeText);

      const cardSummaryText = secData.cardSummary || secData.cardHighlight || secData.title;
      ctx.fillStyle = t.bodyColor;
      ctx.font = 'bold 36px Pretendard, sans-serif';
      ctx.textAlign = 'left';
      drawMultilineText(ctx, cardSummaryText, 64, 280, 672, 54, 5);

      const tipText = secData.cardTip || secData.cardSubtext;
      if (tipText) {
        ctx.fillStyle = t.subColor;
        ctx.font = '600 24px Pretendard, sans-serif';
        drawMultilineText(ctx, tipText, 64, 590, 672, 38, 2);
      }
      ctx.fillStyle = t.lineColor;
      ctx.fillRect(64, 660, 672, 6);
    }

    // ==========================================
    // 2. 모바일 브라우저 100% 저장 호환 다운로드 엔진
    // ==========================================
    async function downloadCanvas(canvasId, fileName) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return alert("이미지를 찾을 수 없습니다.");

      canvas.toBlob(async (blob) => {
        if (!blob) return alert("이미지 생성에 실패했습니다.");

        const file = new File([blob], `${fileName}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: fileName
            });
            return;
          } catch (err) {
            // 취소 또는 실패 시 다운로드 링크 폴백
          }
        }

        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = `${fileName}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      }, 'image/png');
    }

    function toggleArchiveView() {
      isArchiveOpen = !isArchiveOpen;
      const pipelineView = document.getElementById('pipelineView');
      const archiveView = document.getElementById('archiveView');
      const btnToggle = document.getElementById('btnToggleArchive');
      const title = document.getElementById('mainHeaderTitle');
      if (isArchiveOpen) {
        pipelineView.style.display = 'none';
        archiveView.style.display = 'block';
        btnToggle.textContent = '← 메인으로';
        title.textContent = '📚 주제 보관함';
        renderArchive();
      } else {
        pipelineView.style.display = 'block';
        archiveView.style.display = 'none';
        btnToggle.textContent = '📚 주제 보관함';
        title.textContent = '✍️ 포스팅 파이프라인';
      }
    }

    function setCategory(btn, cat) {
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = cat;
    }

    async function recommendTopics() {
      const btn = document.getElementById('btnRecommend');
      const container = document.getElementById('topicsContainer');
      btn.disabled = true;
      btn.textContent = "AI 실시간 검색 중...";
      try {
        const res = await fetch(`${WORKER_URL}/api/recommend-trending-topics`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category: selectedCategory })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
        if (data.topics && data.topics.length > 0) {
          saveTopicsToStorage(data.topics);
          window._topicsData = data.topics;
          container.style.display = 'flex';
          container.innerHTML = data.topics.map((t, idx) => `
            <div class="topic-card-item" onclick="selectTopicByIndex(${idx})">
              <div class="topic-card-kw">📌 ${t.keyword}</div>
              <div class="topic-card-why">💡 ${t.whySelected}</div>
              ${t.questions ? `<div class="topic-q-box"><div class="topic-q-label">🔍 핵심 질문</div><ul class="topic-q-list">${t.questions.map(q => `<li>${q}</li>`).join('')}</ul></div>` : ''}
            </div>
          `).join('');
        }
      } catch (err) {
        alert("주제 발굴 실패:\n" + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "🔍 실시간 주제 5개 발굴";
      }
    }

    function selectTopicByIndex(idx) {
      const t = window._topicsData ? window._topicsData[idx] : null;
      if (t) {
        const kwInput = document.getElementById('keywordInput');
        kwInput.value = t.keyword;
        currentQuestions = t.questions || [];
        window.scrollTo({ top: kwInput.offsetTop - 20, behavior: 'smooth' });
      }
    }

    async function generateTitles() {
      const kwInput = document.getElementById('keywordInput');
      const keyword = kwInput.value.trim();
      const btn = document.getElementById('btnGenerateTitles');
      const container = document.getElementById('titlesContainer');
      if (!keyword) return alert("키워드를 입력해주세요.");
      btn.disabled = true;
      btn.textContent = "제목 생성 중...";
      try {
        const res = await fetch(`${WORKER_URL}/api/generate-titles`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category: selectedCategory, keyword })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
        if (data.titles) {
          container.style.display = 'flex';
          container.innerHTML = data.titles.map(t => `
            <div class="title-card-item" onclick="selectTitle('${t.title.replace(/'/g, "\\'")}')">💡 ${t.title}</div>
          `).join('');
        }
      } catch (err) {
        alert("제목 생성 실패:\n" + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "💡 롱테일 제목 5개 뽑기";
      }
    }

    function selectTitle(title) {
      const input = document.getElementById('selectedTitleInput');
      input.value = title;
      window.scrollTo({ top: input.offsetTop - 20, behavior: 'smooth' });
    }

    async function generateArticle() {
      const keyword = document.getElementById('keywordInput').value.trim();
      const title = document.getElementById('selectedTitleInput').value.trim();
      const btn = document.getElementById('btnGenerateArticle');
      const resultSec = document.getElementById('resultSection');
      const output = document.getElementById('articleOutput');
      const gallery = document.getElementById('cardGallery');

      if (!keyword || !title) return alert("키워드와 제목을 모두 지정해야 합니다.");
      btn.disabled = true;
      btn.textContent = "팩트체크 본문 & 카드 생성 중 (약 10~15초)...";

      try {
        const res = await fetch(`${WORKER_URL}/api/generate-article`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category: selectedCategory, keyword, title, questions: currentQuestions })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

        if (data) {
          resultSec.style.display = 'block';

          gallery.innerHTML = '';
          const thumbHtml = `
            <div class="img-card-wrap">
              <div class="img-card-label">🖼️ 대표 썸네일 카드 (길노트 스타일)</div>
              <canvas id="canvasThumb" class="card-canvas"></canvas>
              <button type="button" class="img-down-btn" onclick="downloadCanvas('canvasThumb', '${keyword}_대표썸네일')">💾 썸네일 다운로드</button>
            </div>
          `;
          gallery.insertAdjacentHTML('beforeend', thumbHtml);
          renderThumbnailCanvas(document.getElementById('canvasThumb'), data.thumbnail || { badge: '2026 알뜰 정책', mainTitle: keyword, subTitle: '알아두면 유용한 가이드' });

          if (data.sections && data.sections.length > 0) {
            data.sections.forEach((sec, idx) => {
              const canvasId = `canvasSec_${idx}`;
              const secHtml = `
                <div class="img-card-wrap">
                  <div class="img-card-label">📌 요약 카드 0${idx + 1}</div>
                  <canvas id="${canvasId}" class="card-canvas"></canvas>
                  <button type="button" class="img-down-btn" onclick="downloadCanvas('${canvasId}', '${keyword}_요약카드_0${idx + 1}')">💾 요약카드 0${idx + 1} 다운로드</button>
                </div>
              `;
              gallery.insertAdjacentHTML('beforeend', secHtml);
              renderSectionCanvas(document.getElementById(canvasId), sec, idx);
            });
          }

          const formattedHtml = buildArticleHtml(data, title);
          window._articleHtml = formattedHtml;
          window._articlePlainText = buildPlainText(data, title);
          
          output.innerHTML = formattedHtml;
          resultSec.scrollIntoView({ behavior: 'smooth' });
        }
      } catch (err) {
        alert("본문 작성 실패:\n" + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "⚡ 팩트체크 본문 & 카드뉴스 생성";
      }
    }

    // 모바일/PC 2단계 클립보드 복사 엔진
    async function copyArticle() {
      const htmlContent = window._articleHtml;
      const plainText = window._articlePlainText || document.getElementById('articleOutput').textContent;

      if (!htmlContent) {
        return alert("복사할 본문이 없습니다. 먼저 원고를 생성해 주세요.");
      }

      let copySuccess = false;

      // 1차: ClipboardItem (브라우저 표준)
      if (navigator.clipboard && window.ClipboardItem) {
        try {
          const item = new ClipboardItem({
            'text/html': new Blob([htmlContent], { type: 'text/html' }),
            'text/plain': new Blob([plainText], { type: 'text/plain' })
          });
          await navigator.clipboard.write([item]);
          copySuccess = true;
        } catch (e) {
          copySuccess = false;
        }
      }

      // 2차: DOM Selection + execCommand (모바일 웹/구형 브라우저)
      if (!copySuccess) {
        try {
          const tempEl = document.createElement('div');
          tempEl.innerHTML = htmlContent;
          tempEl.style.position = 'fixed';
          tempEl.style.left = '-9999px';
          tempEl.style.top = '0';
          tempEl.style.opacity = '0';
          tempEl.style.pointerEvents = 'none';
          document.body.appendChild(tempEl);

          const range = document.createRange();
          range.selectNodeContents(tempEl);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);

          copySuccess = document.execCommand('copy');
          selection.removeAllRanges();
          document.body.removeChild(tempEl);
        } catch (err) {
          copySuccess = false;
        }
      }

      if (copySuccess) {
        alert("본문(형광펜·표 포함)이 복사되었습니다!\n\n※ 모바일 주의: '네이버 블로그 앱' 대신 '모바일 브라우저(Chrome/Safari)'의 블로그 글쓰기 창에 붙여넣어야 서식과 표가 유지됩니다.");
      } else {
        await navigator.clipboard.writeText(plainText);
        alert("서식 복사가 제한되어 일반 텍스트로 복사되었습니다.");
      }
    }

    function saveTopicsToStorage(newTopics) {
      const todayStr = getKoreaDate();
      let archive = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      let todayGroup = archive.find(item => item.date === todayStr);
      if (!todayGroup) {
        todayGroup = { date: todayStr, topics: [] };
        archive.unshift(todayGroup);
      }
      newTopics.forEach((t, idx) => {
        const cleanKw = (t.keyword || '').trim();
        const isDup = todayGroup.topics.some(saved => saved.keyword.trim() === cleanKw);
        if (!isDup && cleanKw) {
          todayGroup.topics.push({ id: `t_${Date.now()}_${idx}`, keyword: cleanKw, whySelected: t.whySelected || '', questions: t.questions || [], status: 'pending' });
        }
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(archive));
    }

    function renderArchive() {
      const archive = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const container = document.getElementById('archiveList');
      const todayStr = getKoreaDate();
      if (archive.length === 0 || archive.every(g => g.topics.length === 0)) {
        container.innerHTML = '<p style="text-align:center; color:#8B95A1; padding:40px 0; font-size:14px;">보관된 주제가 없습니다.</p>';
        return;
      }
      container.innerHTML = archive.map((group, gIdx) => {
        const filtered = group.topics.filter(t => currentArchiveFilter === 'all' || t.status === currentArchiveFilter);
        if (filtered.length === 0) return '';
        const isToday = group.date === todayStr;
        return `
          <div class="date-card">
            <div class="date-header" onclick="toggleAccordion('grp_${gIdx}')">
              <span>📅 ${group.date} (${filtered.length}개)</span>
              <span style="font-size:12px; color:#8B95A1;">${isToday ? '▼' : '▶'}</span>
            </div>
            <div id="grp_${gIdx}" style="display: ${isToday ? 'block' : 'none'};">
              <ul class="topic-list">
                ${filtered.map(t => `
                  <li class="topic-item">
                    <div class="topic-main">
                      <span class="topic-title">${getStatusBadge(t.status)} ${t.keyword}</span>
                      <button class="btn-sm" onclick="toggleDetail('dtl_${t.id}')">상세</button>
                    </div>
                    <div id="dtl_${t.id}" class="topic-detail">
                      <p style="margin-bottom:6px;"><strong>선정 이유:</strong> ${t.whySelected}</p>
                      <ul style="margin:0 0 8px 16px; padding:0;">${(t.questions || []).map(q => `<li>${q}</li>`).join('')}</ul>
                      <div class="topic-actions">
                        <button class="btn-sm btn-write" onclick="startWriteTopic('${group.date}', '${t.id}')">이 주제로 작성</button>
                        <button class="btn-sm" onclick="updateTopicStatus('${group.date}', '${t.id}', 'completed')">완료</button>
                        <button class="btn-sm" onclick="deleteTopic('${group.date}', '${t.id}')">🗑️ 삭제</button>
                      </div>
                    </div>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>
        `;
      }).join('');
    }

    function deleteTopic(date, id) {
      if (!confirm("이 주제를 보관함에서 삭제하시겠습니까?")) return;
      let archive = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const group = archive.find(g => g.date === date);
      if (group) {
        group.topics = group.topics.filter(t => t.id !== id);
        if (group.topics.length === 0) archive = archive.filter(g => g.date !== date);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(archive));
        renderArchive();
      }
    }

    function setArchiveFilter(f, btn) {
      currentArchiveFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderArchive();
    }

    function toggleAccordion(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function toggleDetail(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function getStatusBadge(st) {
      return { pending: '🟡 미작성', in_progress: '🔵 작성중', completed: '🟢 작성완료' }[st] || '🟡 미작성';
    }

    function updateTopicStatus(date, id, st) {
      let archive = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const group = archive.find(g => g.date === date);
      if (group) {
        const topic = group.topics.find(t => t.id === id);
        if (topic) topic.status = st;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(archive));
        renderArchive();
      }
    }

    function startWriteTopic(date, id) {
      let archive = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const group = archive.find(g => g.date === date);
      const topic = group ? group.topics.find(t => t.id === id) : null;
      if (!topic) return;
      topic.status = 'in_progress';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(archive));
      toggleArchiveView();
      document.getElementById('keywordInput').value = topic.keyword;
      currentQuestions = topic.questions || [];
      window.scrollTo({ top: document.getElementById('keywordInput').offsetTop - 20, behavior: 'smooth' });
    }
  </script>
