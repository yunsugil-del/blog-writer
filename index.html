<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 자동화 파이프라인</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h1 style="font-size: 20px; font-weight: 700; color: #0f172a; margin: 0;">🚀 블로그 글 생성 파이프라인</h1>
      <a href="topics.html" style="text-decoration: none; font-size: 13px; font-weight: 600; color: #2563eb; background: #eff6ff; padding: 6px 12px; border-radius: 6px; border: 1px solid #dbeafe;">
        📚 주제 보관함
      </a>
    </div>

    <div class="card-step">
      <label class="step-label">0단계. 실시간 트렌드 주제 발굴</label>
      <div style="display: flex; gap: 8px; margin-bottom: 10px;">
        <select id="categorySelect" style="flex: 1; height: 44px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 10px;">
          <option value="경제·복지·지원금">경제·복지·지원금</option>
          <option value="생활·교통·할인">생활·교통·할인</option>
          <option value="청년·취업·육아">청년·취업·육아</option>
        </select>
        <button type="button" id="btnRecommend" class="btn btn-primary" style="flex: 1; height: 44px;">실시간 주제 5개 발굴</button>
      </div>
      <div id="topicsContainer" style="display: none; margin-top: 10px;"></div>
    </div>

    <div class="card-step" style="margin-top: 16px;">
      <label for="keywordInput" class="step-label">1단계. 선택 키워드</label>
      <input type="text" id="keywordInput" placeholder="주제를 직접 입력하거나 위에서 선택하세요" style="width: 100%; height: 44px; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 0 12px; margin-bottom: 10px; box-sizing: border-box;">
      <button type="button" id="btnGenerateTitles" class="btn btn-primary">롱테일 제목 5개 뽑기</button>
      <div id="titlesContainer" style="display: none; margin-top: 12px;"></div>
    </div>

    <div class="card-step" style="margin-top: 16px;">
      <label class="step-label">2단계. 선택된 제목</label>
      <input type="text" id="selectedTitleInput" placeholder="제목을 선택하면 자동 입력됩니다" readonly style="width: 100%; height: 44px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 12px; background: #f8fafc; margin-bottom: 10px; box-sizing: border-box;">
      <button type="button" id="btnGenerateArticle" class="btn btn-primary" style="background-color: #059669;">팩트체크 본문 & 카드뉴스 집필</button>
    </div>

    <div id="resultSection" style="display: none; margin-top: 24px;">
      <div class="card-step">
        <h3 style="font-size: 16px; margin-bottom: 12px;">📄 완성된 원고</h3>
        <button type="button" id="btnCopyArticle" class="btn btn-secondary" style="margin-bottom: 10px;">본문 전체 복사</button>
        <div id="articleOutput" style="white-space: pre-wrap; font-size: 14px; line-height: 1.6; background: #fff; padding: 14px; border-radius: 8px; border: 1px solid #e2e8f0;"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
