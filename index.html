<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전문 블로그 원스톱 콘텐츠 팩토리</title>
  <style>
    :root {
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --primary-light: #EFF6FF;
      --ink: #0F172A;
      --ink-soft: #64748B;
      --ink-muted: #94A3B8;
      --bg: #F8FAFC;
      --white: #FFFFFF;
      --border: #E2E8F0;
      --success: #10B981;
      --danger: #EF4444;
      --warning-bg: #FFFBEB;
      --warning-border: #FEF3C7;
      --warning-text: #92400E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      padding: 32px 16px 100px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 760px; margin: 0 auto; width: 100%; }

    /* Header */
    .header { text-align: center; margin-bottom: 32px; }
    .header-badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .header h1 { font-size: 26px; color: var(--ink); margin: 0 0 8px; font-weight: 800; letter-spacing: -0.5px; }
    .header p { color: var(--ink-soft); font-size: 14.5px; margin: 0; }

    /* Cards */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .step-pill {
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Category Buttons */
    .category-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .cat-btn {
      background: var(--white);
      border: 1.5px solid var(--border);
      color: var(--ink-soft);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn:hover { border-color: var(--primary); }
    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Inputs & Buttons */
    .input-row { display: flex; gap: 10px; margin-bottom: 14px; }
    input[type="text"] {
      flex: 1;
      padding: 13px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn-main {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-main:hover { background: var(--primary-hover); }
    .btn-main:disabled { background: var(--border); color: var(--ink-muted); cursor: not-allowed; }

    .btn-secondary {
      background: var(--white);
      color: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-secondary:hover { background: var(--primary-light); }

    /* Trending Topics Stream */
    .trending-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .topic-card {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: #FAFAFA;
      cursor: pointer;
      transition: all 0.2s;
    }
    .topic-card:hover {
      border-color: var(--primary);
      background: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37,99,235,0.08);
    }
    .topic-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .topic-kw { font-size: 16px; font-weight: 800; color: var(--ink); }
    .topic-badge {
      font-size: 11.5px;
      font-weight: 700;
      background: var(--primary-light);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .topic-reason { font-size: 13px; color: #475569; margin-bottom: 10px; line-height: 1.4; }
    .topic-questions {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12.5px;
      color: var(--warning-text);
    }
    .topic-questions ul { margin: 4px 0 0; padding-left: 16px; }
    .topic-select-cta {
      margin-top: 10px;
      text-align: right;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Titles Radio */
    .title-option {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }
    .title-option:hover { border-color: var(--primary); }
    .title-option.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      font-weight: 700;
    }
    .title-option input { margin: 0; }

    /* Output Section */
    .output-box {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-bottom: 14px;
    }
    .btn-copy {
      background: var(--success);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .btn-copy:hover { background: #059669; }

    .status-text {
      text-align: center;
      font-size: 13.5px;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="header-badge">AI FACT-BASED ENGINE</span>
    <h1>전문 블로그 콘텐츠 팩토리</h1>
    <p>실시간 구글 검색 트렌드 발굴부터 팩트 기반 본문 생성까지</p>
  </div>

  <!-- STEP 0: 실시간 핫이슈 탐색 -->
  <div class="card">
    <div class="section-title">
      <span class="step-pill">0단계</span>
      <span>실시간 핫이슈 & 검색의도 탐색 (선택사항)</span>
    </div>
    
    <div class="category-group">
      <button class="cat-btn active" data-cat="경제·복지·지원금">📊 경제·복지·지원금</button>
      <button class="cat-btn" data-cat="생활·상식·절약">📋 생활·상식·절약</button>
      <button class="cat-btn" data-cat="재테크·부동산">💰 재테크·부동산</button>
      <button class="cat-btn" data-cat="전체 트렌드">🌐 종합 핫이슈</button>
    </div>

    <button class="btn-main" id="btn-fetch-trending">🔍 최신 실시간 이슈 5개 발굴</button>
    <div id="trending-status" class="status-text"></div>
    <div class="trending-list" id="trending-container"></div>
  </div>

  <!-- STEP 1: 키워드 입력 & 제목 추천 -->
  <div class="card" id="step1-card">
    <div class="section-title">
      <span class="step-pill">1단계</span>
      <span>블로그 키워드 확정 및 제목 생성</span>
    </div>

    <div class="input-row">
      <input type="text" id="target-keyword" placeholder="주제를 입력하거나 위 0단계 카드를 클릭하세요." />
      <button class="btn-secondary" id="btn-gen-titles">제목 5개 추출</button>
    </div>

    <div id="titles-status" class="status-text"></div>
    <div id="titles-container" style="margin-top: 14px;"></div>
  </div>

  <!-- STEP 2: 본문 & 팩트 카드 생성 -->
  <div class="card" id="step2-card" style="display: none;">
    <div class="section-title">
      <span class="step-pill">2단계</span>
      <span>팩트 기반 본문 & 카드뉴스 생성</span>
    </div>

    <button class="btn-main" id="btn-gen-article">🚀 선택한 제목으로 검증 원고 생성</button>
    <div id="article-status" class="status-text"></div>

    <div id="output-zone" style="display: none; margin-top: 20px;">
      <div class="output-box" id="article-preview"></div>
      <button class="btn-copy" id="btn-copy-html">📋 네이버 블로그용 HTML 서식 복사</button>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = "https://blog-writer.yunsugil.workers.dev";

  let selectedCategory = "경제·복지·지원금";
  let selectedTitle = "";
  let generatedArticleData = null;

  // Elements
  const catBtns = document.querySelectorAll('.cat-btn');
  const btnFetchTrending = document.getElementById('btn-fetch-trending');
  const trendingStatus = document.getElementById('trending-status');
  const trendingContainer = document.getElementById('trending-container');

  const targetKeyword = document.getElementById('target-keyword');
  const btnGenTitles = document.getElementById('btn-gen-titles');
  const titlesStatus = document.getElementById('titles-status');
  const titlesContainer = document.getElementById('titles-container');

  const step2Card = document.getElementById('step2-card');
  const btnGenArticle = document.getElementById('btn-gen-article');
  const articleStatus = document.getElementById('article-status');
  const outputZone = document.getElementById('output-zone');
  const articlePreview = document.getElementById('article-preview');
  const btnCopyHtml = document.getElementById('btn-copy-html');

  // URL 파라미터 자동 입력 지원
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('kw')) {
    targetKeyword.value = urlParams.get('kw');
  }

  // 카테고리 선택
  catBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      catBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = btn.getAttribute('data-cat');
    });
  });

  // STEP 0: 실시간 트렌드 발굴
  btnFetchTrending.addEventListener('click', async () => {
    btnFetchTrending.disabled = true;
    trendingStatus.style.color = "var(--primary)";
    trendingStatus.innerText = "🔍 구글 실시간 검색으로 최신 팩트 이슈 분석 중... (약 4~5초)";
    trendingContainer.innerHTML = "";

    try {
      const res = await fetch(`${WORKER_URL}/api/recommend-trending-topics`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: selectedCategory })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "트렌드 조회 실패");

      renderTrendingCards(data.topics);
      trendingStatus.innerText = "";
    } catch (err) {
      trendingStatus.style.color = "var(--danger)";
      trendingStatus.innerText = err.message;
    } finally {
      btnFetchTrending.disabled = false;
    }
  });

  function renderTrendingCards(topics) {
    trendingContainer.innerHTML = "";
    if (!topics || topics.length === 0) {
      trendingContainer.innerHTML = "<p style='text-align:center;'>추천 결과가 없습니다.</p>";
      return;
    }

    topics.forEach((t, idx) => {
      const card = document.createElement('div');
      card.className = "topic-card";
      
      const qListHtml = (t.questions || []).map(q => `<li>${escapeHtml(q)}</li>`).join('');

      card.innerHTML = `
        <div class="topic-head">
          <span class="topic-kw">${idx + 1}. ${escapeHtml(t.keyword)}</span>
          <span class="topic-badge">실시간 팩트</span>
        </div>
        <div class="topic-reason">${escapeHtml(t.whySelected)}</div>
        <div class="topic-questions">
          <strong>🤔 독자 핵심 질문 TOP 3:</strong>
          <ul>${qListHtml}</ul>
        </div>
        <div class="topic-select-cta">👉 클릭 시 1단계 키워드로 즉시 반영</div>
      `;

      // 카드 클릭 시 키워드 자동 주입 & 스크롤 이동
      card.addEventListener('click', () => {
        targetKeyword.value = t.keyword;
        document.getElementById('step1-card').scrollIntoView({ behavior: 'smooth' });
        targetKeyword.focus();
      });

      trendingContainer.appendChild(card);
    });
  }

  // STEP 1: 제목 5개 추출
  btnGenTitles.addEventListener('click', async () => {
    const kw = targetKeyword.value.trim();
    if (!kw) return alert("키워드를 입력하거나 위 트렌드 카드를 선택하세요.");

    btnGenTitles.disabled = true;
    titlesStatus.style.color = "var(--primary)";
    titlesStatus.innerText = "🔍 검색 의도에 맞춘 제목 5개 추출 중...";
    titlesContainer.innerHTML = "";
    step2Card.style.display = "none";

    try {
      const res = await fetch(`${WORKER_URL}/api/generate-titles`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: selectedCategory, keyword: kw })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "제목 생성 실패");

      renderTitles(data.titles);
      titlesStatus.innerText = "";
      step2Card.style.display = "block";
    } catch (err) {
      titlesStatus.style.color = "var(--danger)";
      titlesStatus.innerText = err.message;
    } finally {
      btnGenTitles.disabled = false;
    }
  });

  function renderTitles(titles) {
    titlesContainer.innerHTML = "";
    titles.forEach((item, idx) => {
      const row = document.createElement('label');
      row.className = `title-option ${idx === 0 ? 'selected' : ''}`;
      
      const radio = document.createElement('input');
      radio.type = "radio";
      radio.name = "title-radio";
      radio.value = item.title;
      if (idx === 0) {
        radio.checked = true;
        selectedTitle = item.title;
      }

      radio.addEventListener('change', () => {
        document.querySelectorAll('.title-option').forEach(el => el.classList.remove('selected'));
        row.classList.add('selected');
        selectedTitle = item.title;
      });

      row.appendChild(radio);
      row.appendChild(document.createTextNode(item.title));
      titlesContainer.appendChild(row);
    });
  }

  // STEP 2: 본문 및 카드뉴스 생성
  btnGenArticle.addEventListener('click', async () => {
    if (!selectedTitle) return alert("제목을 먼저 선택해 주세요.");

    btnGenArticle.disabled = true;
    articleStatus.style.color = "var(--primary)";
    articleStatus.innerText = "🔍 실시간 구글 팩트체크 후 본문 집필 중... (약 5~8초)";
    outputZone.style.display = "none";

    try {
      const res = await fetch(`${WORKER_URL}/api/generate-article`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          category: selectedCategory,
          keyword: targetKeyword.value.trim(),
          title: selectedTitle
        })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "본문 생성 실패");

      generatedArticleData = data;
      renderArticlePreview(data);
      outputZone.style.display = "block";
      articleStatus.innerText = "";
    } catch (err) {
      articleStatus.style.color = "var(--danger)";
      articleStatus.innerText = err.message;
    } finally {
      btnGenArticle.disabled = false;
    }
  });

  function renderArticlePreview(data) {
    let text = `[SEO 요약]\n${data.metaDescription}\n\n`;
    text += `[태그]\n${data.tags.map(t => `#${t}`).join(' ')}\n\n`;
    text += `[도입부]\n${data.intro}\n\n`;
    data.sections.forEach(sec => {
      text += `■ ${sec.step}: ${sec.title}\n`;
      text += `💡 팩트 요약: ${sec.cardHighlight}\n`;
      text += `${sec.body}\n\n`;
    });
    text += `[마무리]\n${data.outro}\n\n[출처: ${data.source}]`;
    articlePreview.innerText = text;
  }

  // 네이버 블로그용 HTML 서식 클립보드 복사
  btnCopyHtml.addEventListener('click', () => {
    if (!generatedArticleData) return;
    const d = generatedArticleData;

    let html = `
      <div style="font-family: 'Apple SD Gothic Neo', sans-serif; line-height: 1.8; color: #1e293b; max-width: 680px; margin: 0 auto;">
        <p style="font-size: 16px; color: #334155; margin-bottom: 24px;">${escapeHtml(d.intro)}</p>
    `;

    d.sections.forEach(sec => {
      html += `
        <h2 style="font-size: 19px; font-weight: 800; color: #0f172a; margin-top: 36px; margin-bottom: 12px; border-bottom: 2px solid #2563eb; padding-bottom: 6px;">
          ${escapeHtml(sec.step)}. ${escapeHtml(sec.title)}
        </h2>
        <div style="background: #eff6ff; border-left: 4px solid #2563eb; padding: 14px 16px; border-radius: 0 8px 8px 0; margin-bottom: 14px;">
          <strong style="color: #1e40af; font-size: 14.5px;">💡 핵심 체크:</strong>
          <span style="color: #1e3a8a; font-size: 14.5px; font-weight: 600;"> ${escapeHtml(sec.cardHighlight)}</span>
        </div>
        <p style="font-size: 15.5px; color: #334155; margin-bottom: 24px;">${escapeHtml(sec.body)}</p>
      `;
    });

    html += `
        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-top: 36px;">
          <p style="font-size: 15px; color: #334155; margin: 0 0 10px;">${escapeHtml(d.outro)}</p>
          <p style="font-size: 13px; color: #64748b; margin: 0;">📌 공식 출처: <strong>${escapeHtml(d.source)}</strong></p>
        </div>
        <p style="font-size: 13.5px; color: #2563eb; margin-top: 20px;">${d.tags.map(t => `#${escapeHtml(t)}`).join(' ')}</p>
      </div>
    `;

    navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([articlePreview.innerText], { type: 'text/plain' })
      })
    ]).then(() => {
      alert("네이버 블로그 서식(HTML)이 복사되었습니다! 블로그 에디터에 바로 붙여넣기(Ctrl+V) 하세요.");
    }).catch(() => {
      navigator.clipboard.writeText(articlePreview.innerText);
      alert("텍스트가 복사되었습니다.");
    });
  });

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
