<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 주제 보관함</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #F4F6F8; color: #191F28; line-height: 1.5; padding: 24px 16px 80px; display: flex; justify-content: center; }
    .archive-container { width: 100%; max-width: 520px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .top-nav h2 { font-size: 20px; font-weight: 800; color: #191F28; letter-spacing: -0.5px; }
    .top-nav a { font-size: 13px; font-weight: 700; color: #6B7684; text-decoration: none; padding: 6px 12px; background: #E5E8EB; border-radius: 14px; }
    .filter-bar { display: flex; gap: 6px; margin-bottom: 16px; }
    .filter-btn { padding: 6px 14px; border: 1px solid #E5E8EB; background: #FFFFFF; border-radius: 20px; font-size: 13px; font-weight: 600; color: #4E5968; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .filter-btn.active { background: #3182F6; color: #FFFFFF; border-color: #3182F6; }
    .date-card { background: #FFFFFF; border-radius: 16px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.04); }
    .date-header { padding: 14px 18px; background: #FAFAFB; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F2F4F6; font-size: 14.5px; color: #333D4B; }
    .topic-list { list-style: none; }
    .topic-item { padding: 14px 18px; border-bottom: 1px solid #F2F4F6; }
    .topic-item:last-child { border-bottom: none; }
    .topic-main { display: flex; justify-content: space-between; align-items: center; }
    .topic-title { font-size: 14px; font-weight: 700; color: #191F28; display: flex; align-items: center; gap: 6px; }
    .topic-detail { display: none; margin-top: 10px; padding: 12px; background: #F8FAFC; border-radius: 10px; font-size: 12.5px; color: #4E5968; }
    .topic-actions { display: flex; gap: 6px; margin-top: 10px; }
    .btn-sm { padding: 6px 10px; font-size: 12px; font-weight: 600; border-radius: 6px; border: 1px solid #E5E8EB; background: #FFFFFF; cursor: pointer; font-family: inherit; color: #4E5968; }
    .btn-write { background: #3182F6; color: #FFFFFF; border-color: #3182F6; }
  </style>
</head>
<body>
  <div class="archive-container">
    <div class="top-nav">
      <h2>📚 주제 보관함</h2>
      <a href="index.html">← 메인으로</a>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all', this)">전체</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">🟡 미작성</button>
      <button class="filter-btn" onclick="setFilter('completed', this)">🟢 작성완료</button>
    </div>

    <div id="archiveList"></div>
  </div>

  <script src="topics.js"></script>
</body>
</html>
