<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>블로그 라이터 Pro</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --ink: #1F2937;
      --ink-soft: #6B7280;
      --bg: #F9FAFB;
      --white: #FFFFFF;
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      padding: 30px 20px 80px;
    }
    .container { max-width: 860px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 24px; color: var(--primary); margin: 0 0 6px; font-weight: 800; }
    .header p { color: var(--ink-soft); font-size: 14px; margin: 0; }

    .card-panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 20px;
    }

    .section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--ink); }
    
    .chip-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .chip {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }

    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    button.btn {
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }
    button.btn-primary { background: var(--primary); color: #fff; }
    button.btn-primary:disabled { background: var(--border); cursor: not-allowed; }

    .title-list { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
    .title-item {
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      font-size: 14.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }
    .title-item.selected { border-color: var(--primary); background: var(--primary-light); font-weight: 700; color: var(--primary); }

    .result-panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px 24px;
      margin-top: 20px;
      line-height: 1.9;
      font-size: 15.5px;
    }
    .result-panel h1 { font-size: 22px; margin-bottom: 24px; line-height: 1.4; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
    
    .quote-box {
      margin: 30px 0 16px;
      text-align: center;
      background: #F8FAFC;
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      padding: 16px 20px;
    }
    .quote-text { font-size: 16.5px; font-weight: 700; color: var(--ink); }

    .thumb-wrap { text-align: center; margin-bottom: 10px; }
    .thumb-wrap img { width: 100%; max-width: 500px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .card-wrap { text-align: center; margin: 10px 0; }
    .card-wrap img { width: 100%; max-width: 520px; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,0.06); }

    .img-down-btn {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 8px auto 24px;
      background: #0284C7;
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .img-down-btn:hover { background: #0369A1; }

    /* [출처 기능 추가] 출처 박스 UI 스타일 */
    .source-box {
      margin-top: 28px;
      padding: 18px 20px;
      background: #F1F5F9;
      border-radius: 8px;
      border: 1px solid #CBD5E1;
      font-size: 13.5px;
      line-height: 1.6;
    }
    .source-title {
      font-weight: 700;
      color: #334155;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .source-list {
      list-style-type: none;
      padding-left: 0;
      margin: 0;
    }
    .source-item {
      margin-bottom: 10px;
      padding-left: 12px;
      border-left: 2px solid var(--primary);
    }
    .source-name {
      font-weight: 600;
      color: var(--ink);
    }
    .source-url {
      display: block;
      color: #2563EB;
      word-break: break-all;
      text-decoration: none;
      font-size: 12.5px;
    }
    .source-url:hover { text-decoration: underline; }
    .source-empty {
      color: var(--ink-soft);
      font-style: italic;
    }

    .toolbar { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .btn-copy {
      background: #fff;
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-copy:hover { background: var(--primary); color: #fff; }
    .status-msg { margin-top: 12px; font-size: 13.5px; font-weight: 600; color: var(--primary); text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>블로그 라이터 Pro</h1>
    <p>실시간 검색 검증 & 팩트 가드레일 자동화</p>
  </div>

  <div class="card-panel">
    <div class="section-title">1. 카테고리 선택</div>
    <div class="chip-group">
      <div class="chip active" data-cat="경제/복지/지원금">📊 경제·복지·지원금</div>
      <div class="chip" data-cat="생활/상식">📋 생활·상식</div>
      <div class="chip" data-cat="재테크/부동산">💰 재테크·부동산</div>
    </div>

    <div class="section-title">2. 키워드 입력</div>
    <div class="input-row">
      <input id="kw-input" type="text" placeholder="키워드를 입력하세요 (예: 2026 청년미래적금)" />
      <button class="btn btn-primary" id="btn-suggest">제목 5개 추천</button>
    </div>
    <div id="suggest-status"></div>

    <div id="title-selection-area" style="display: none;">
      <div class="section-title" style="margin-top: 24px;">3. 마음에 드는 제목 선택</div>
      <div class="title-list" id="title-list"></div>

      <button class="btn btn-primary" style="width: 100%; padding: 15px; margin-top: 12px;" id="btn-generate">
        ✍️ 원고 및 이미지 세트 생성하기
      </button>
    </div>
  </div>

  <div id="status-area"></div>
  <div id="result-area"></div>
</div>

<script>
  const PROXY_ENDPOINT = "https://wispy-brook-5781.yunsugil.workers.dev";
  let selectedCategory = '경제/복지/지원금';
  let currentKeyword = '';
  let selectedTitle = '';

  const chips = document.querySelectorAll('.chip');
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      selectedCategory = chip.getAttribute('data-cat');
    });
  });

  function getTodayString() {
    return new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" });
  }

  // XSS 방지 HTML Escape 함수
  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatBody(text) {
    return escapeHtml(text).replace(/\n/g, '<br/>');
  }

  function safeParseJSON(rawText, type) {
    if (!rawText || typeof rawText !== 'string') throw new Error("응답 본문이 비어 있습니다.");
    var cleaned = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

    if (type === 'array' || type === 'any') {
      var start = cleaned.indexOf('[');
      var end = cleaned.lastIndexOf(']');
      if (start !== -1 && end !== -1 && end > start) {
        try { return JSON.parse(cleaned.substring(start, end + 1)); } catch (e) {}
      }
    }

    if (type === 'object' || type === 'any') {
      var startObj = cleaned.indexOf('{');
      var endObj = cleaned.lastIndexOf('}');
      if (startObj !== -1 && endObj !== -1 && endObj > startObj) {
        try { return JSON.parse(cleaned.substring(startObj, endObj + 1)); } catch (e) {}
      }
    }

    var lines = cleaned.split('\n')
      .map(function(l) { return l.replace(/^[\d\.\-\*\s]+/, '').replace(/["'\[\]\{\}]/g, '').trim(); })
      .filter(function(l) { return l.length > 5; });
    
    if (lines.length >= 3) return lines.slice(0, 5);
    throw new Error("데이터 파싱 실패");
  }

  const kwInput = document.getElementById('kw-input');
  const btnSuggest = document.getElementById('btn-suggest');

  kwInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) suggestTitles();
  });
  btnSuggest.addEventListener('click', suggestTitles);

  async function suggestTitles() {
    const keyword = kwInput.value.trim();
    if (!keyword) { alert("키워드를 입력해 주세요."); return; }

    currentKeyword = keyword;

    const status = document.getElementById('suggest-status');
    const titleArea = document.getElementById('title-selection-area');
    const list = document.getElementById('title-list');

    btnSuggest.disabled = true;
    status.innerHTML = `<div class="status-msg">실시간 최신 검색을 기반으로 제목 5개를 추출 중입니다...</div>`;

    const prompt = `키워드: [${currentKeyword}], 카테고리: [${selectedCategory}], 기준일: [${getTodayString()}]
구글 실시간 검색을 바탕으로 최신 팩트에 부합하는 매력적인 블로그 제목 5개를 작성하라.

[원칙]
1. 허위 날짜나 미확정 사실을 단정하지 말 것.
2. 손실 회피, 비교, 구체적 혜택, 타깃 독자 명시 기법을 활용할 것.
3. 22자~32자 내외로 간결하게 작성할 것.

순수 JSON 배열 포맷으로만 응답하라.
\`\`\`json
["제목 1", "제목 2", "제목 3", "제목 4", "제목 5"]
\`\`\``;

    try {
      const res = await fetch(PROXY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }] })
      });

      const data = await res.json();
      if (data.error) throw new Error(typeof data.error === 'object' ? data.error.message : data.error);

      const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error("서버 응답 오류");

      const titles = safeParseJSON(rawText, 'array');

      list.innerHTML = '';
      titles.forEach((t, idx) => {
        const item = document.createElement('div');
        item.className = `title-item ${idx === 0 ? 'selected' : ''}`;
        item.innerHTML = `<input type="radio" name="title_r" ${idx === 0 ? 'checked' : ''} /> <span>${escapeHtml(t)}</span>`;
        item.addEventListener('click', () => {
          document.querySelectorAll('.title-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
          item.querySelector('input').checked = true;
          selectedTitle = t;
        });
        list.appendChild(item);
      });

      selectedTitle = titles[0];
      titleArea.style.display = 'block';
      status.innerHTML = '';
    } catch (e) {
      status.innerHTML = `<div style="color:red; font-size:13.5px; margin-top:8px;">오류: ${e.message}</div>`;
    } finally {
      btnSuggest.disabled = false;
    }
  }

  function renderKoreanText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 3) {
    const chars = Array.from(text);
    let line = '';
    let currentY = y;
    let lineCount = 0;

    for (let i = 0; i < chars.length; i++) {
      let testLine = line + chars[i];
      if (ctx.measureText(testLine).width > maxWidth && i > 0) {
        ctx.fillText(line, x, currentY);
        line = chars[i];
        currentY += lineHeight;
        lineCount++;
        if (lineCount >= maxLines - 1) {
          const remaining = chars.slice(i).join('');
          if (ctx.measureText(remaining).width > maxWidth) {
            ctx.fillText(remaining.substring(0, 15) + '...', x, currentY);
            return currentY;
          }
        }
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, currentY);
    return currentY;
  }

  function createMainThumbnail(subTag, mainTitle) {
    const canvas = document.createElement('canvas');
    canvas.width = 800; canvas.height = 800;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 800, 800);
    grad.addColorStop(0, '#042F2E');
    grad.addColorStop(1, '#115E59');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 800);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 3;
    ctx.strokeRect(30, 30, 740, 740);

    ctx.fillStyle = '#F59E0B';
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText(`● ${subTag || 'SPECIAL GUIDE'}`, 60, 110);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 46px sans-serif';
    
    const lastY = renderKoreanText(ctx, mainTitle, 60, 240, 680, 68, 4);

    ctx.strokeStyle = '#F59E0B';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(60, lastY + 36);
    ctx.lineTo(260, lastY + 36);
    ctx.stroke();

    ctx.fillStyle = '#E5E7EB';
    ctx.font = '24px sans-serif';
    ctx.fillText('핵심 조건 · 금액 · 신청 절차 완벽 정리', 60, 720);

    return canvas.toDataURL('image/png');
  }

  function createCardImage(num, title, p1, p2) {
    const canvas = document.createElement('canvas');
    canvas.width = 1000; canvas.height = 650;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#0F172A';
    ctx.fillRect(0, 0, 1000, 650);

    ctx.fillStyle = '#F59E0B';
    ctx.beginPath();
    ctx.roundRect(50, 50, 70, 44, 6);
    ctx.fill();

    ctx.fillStyle = '#0F172A';
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText(num, 70, 81);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 36px sans-serif';
    renderKoreanText(ctx, title || '핵심 요약 포인트', 50, 160, 900, 48, 1);

    ctx.strokeStyle = '#F59E0B';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(50, 195);
    ctx.lineTo(950, 195);
    ctx.stroke();

    ctx.fillStyle = '#F59E0B';
    ctx.beginPath();
    ctx.arc(68, 280, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#F8FAFC';
    ctx.font = 'bold 27px sans-serif';
    renderKoreanText(ctx, p1 || '핵심 기준 및 주요 요건 확인', 95, 290, 850, 38, 2);

    if (p2) {
      ctx.fillStyle = '#F59E0B';
      ctx.beginPath();
      ctx.arc(68, 390, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#E2E8F0';
      ctx.font = '25px sans-serif';
      renderKoreanText(ctx, p2, 95, 400, 850, 36, 2);
    }

    ctx.fillStyle = '#64748B';
    ctx.font = '20px sans-serif';
    ctx.fillText('※ 상세 내용은 본문 가이드를 참고해 주세요.', 50, 580);

    return canvas.toDataURL('image/png');
  }

  function downloadImage(dataUrl, filename) {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // [출처 기능 추가] Grounding Metadata에서 중복 없는 출처 최대 5개 추출 및 HTML 렌더링
  function extractSourcesHTML(candidate) {
    try {
      const chunks = candidate?.groundingMetadata?.groundingChunks;
      if (!Array.isArray(chunks) || chunks.length === 0) {
        return `<div class="source-box"><div class="source-title">🔎 참고한 검색 출처</div><div class="source-empty">검색 출처를 확인할 수 없습니다.</div></div>`;
      }

      const uniqueSources = [];
      const seenUrls = new Set();

      for (const chunk of chunks) {
        const web = chunk.web;
        if (web && web.uri && !seenUrls.has(web.uri)) {
          seenUrls.add(web.uri);
          uniqueSources.push({
            title: web.title || '공식 웹페이지 정보',
            uri: web.uri
          });
        }
        if (uniqueSources.length >= 5) break; // 최대 5개 제한
      }

      if (uniqueSources.length === 0) {
        return `<div class="source-box"><div class="source-title">🔎 참고한 검색 출처</div><div class="source-empty">검색 출처를 확인할 수 없습니다.</div></div>`;
      }

      const listHtml = uniqueSources.map(s => `
        <li class="source-item">
          <span class="source-name">${escapeHtml(s.title)}</span>
          <a class="source-url" href="${escapeHtml(s.uri)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.uri)}</a>
        </li>
      `).join('');

      return `
        <div class="source-box">
          <div class="source-title">🔎 참고한 검색 출처 (발행 전 팩트 검증용)</div>
          <ul class="source-list">${listHtml}</ul>
        </div>
      `;
    } catch (e) {
      return `<div class="source-box"><div class="source-title">🔎 참고한 검색 출처</div><div class="source-empty">검색 출처를 확인할 수 없습니다.</div></div>`;
    }
  }

  const btnGenerate = document.getElementById('btn-generate');
  btnGenerate.addEventListener('click', generateStructuredPost);

  async function generateStructuredPost() {
    const status = document.getElementById('status-area');
    const resultArea = document.getElementById('result-area');

    btnGenerate.disabled = true;
    status.innerHTML = `<div class="status-msg">실시간 팩트체크 및 원고 렌더링 중입니다...</div>`;
    resultArea.innerHTML = '';

    const prompt = `너는 신뢰성 1위의 대한민국 전문 블로그 칼럼니스트다.
[기본 정보]
- 원본 키워드: "${currentKeyword}"
- 카테고리: "${selectedCategory}"
- 선택된 제목: "${selectedTitle}"
- 기준일: [${getTodayString()}]

[실시간 검색 기반 팩트체크 지침 - 절대 준수]
1. 반드시 구글 검색을 활용하여 정부 공식 발표, 법령, 공공기관 1차 출처를 우선 검증하라.
2. 기준일 현재 확정되지 않은 일정이나 금액을 임의로 단정(창작)하지 말 것.
3. 미확정/루머 이슈는 "현재 공식 발표 예정 상태", "부적격 주의사항" 형태로 객관적으로 기술하라.
4. 나이, 소득 기준, 지원 금액 등 숫자는 철저히 사실에 기반하여 서술하라.

본문 내용과 카드뉴스 3장용 요약을 아래 순수 JSON 객체 포맷으로만 작성하라.
\`\`\`json
{
  "intro": "도입부 인사말 및 배경 설명 (줄바꿈 포함 4~5문장)",
  "section1_quote": "소제목 1 인용구 텍스트",
  "card1": { "title": "카드 1 제목", "point1": "핵심 팩트 요약 1", "point2": "세부 내용 문구 2" },
  "section1_body": "소제목 1 상세 설명 글 (줄바꿈 포함)",
  "section2_quote": "소제목 2 인용구 텍스트",
  "card2": { "title": "카드 2 제목", "point1": "핵심 자격/절차 요약 1", "point2": "세부 내용 문구 2" },
  "section2_body": "소제목 2 상세 설명 및 신청 절차 글",
  "section3_quote": "소제목 3 필수 주의사항 인용구",
  "card3": { "title": "카드 3 제목", "point1": "주의사항 요약 1", "point2": "주의사항 요약 2" },
  "section3_body": "소제목 3 주의사항 및 실무 팁",
  "faq": "자주 묻는 질문 Q&A 3개 (문단 형태)",
  "hashtags": "#정보공유 #필수혜택 #정부정책 #완벽정리"
}
\`\`\``;

    try {
      const res = await fetch(PROXY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }] })
      });

      const data = await res.json();
      if (data.error) throw new Error(typeof data.error === 'object' ? data.error.message : data.error);

      const candidate = data?.candidates?.[0];
      const rawText = candidate?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error("응답 본문이 비어 있습니다.");

      const doc = safeParseJSON(rawText, 'object');

      // [출처 기능 추가] 검색 출처 HTML 추출
      const sourcesHtml = extractSourcesHTML(candidate);

      const mainThumb = createMainThumbnail("정책·금융 가이드", selectedTitle);
      const cardImg1 = createCardImage("01", doc.card1?.title, doc.card1?.point1, doc.card1?.point2);
      const cardImg2 = createCardImage("02", doc.card2?.title, doc.card2?.point1, doc.card2?.point2);
      const cardImg3 = createCardImage("03", doc.card3?.title, doc.card3?.point1, doc.card3?.point2);

      resultArea.innerHTML = `
        <div class="result-panel" id="blog-content">
          <div class="thumb-wrap"><img id="img-thumb" src="${mainThumb}" alt="대표 썸네일" /></div>
          <button class="img-down-btn" id="btn-dl-thumb">⬇️ 썸네일 다운로드</button>
          
          <h1>${escapeHtml(selectedTitle)}</h1>
          <p>${formatBody(doc.intro)}</p>

          <div class="quote-box"><div class="quote-text">“ ${escapeHtml(doc.section1_quote || '핵심 혜택 요약')} ”</div></div>
          <div class="card-wrap"><img id="img-card1" src="${cardImg1}" alt="요약카드1" /></div>
          <button class="img-down-btn" id="btn-dl-card1">⬇️ 카드뉴스 1 다운로드</button>
          <p>${formatBody(doc.section1_body)}</p>

          <div class="quote-box"><div class="quote-text">“ ${escapeHtml(doc.section2_quote || '상세 요건 및 신청 방법')} ”</div></div>
          <div class="card-wrap"><img id="img-card2" src="${cardImg2}" alt="요약카드2" /></div>
          <button class="img-down-btn" id="btn-dl-card2">⬇️ 카드뉴스 2 다운로드</button>
          <p>${formatBody(doc.section2_body)}</p>

          <div class="quote-box"><div class="quote-text">“ ${escapeHtml(doc.section3_quote || '실무자 필수 주의사항')} ”</div></div>
          <div class="card-wrap"><img id="img-card3" src="${cardImg3}" alt="요약카드3" /></div>
          <button class="img-down-btn" id="btn-dl-card3">⬇️ 카드뉴스 3 다운로드</button>
          <p>${formatBody(doc.section3_body)}</p>

          <div class="quote-box"><div class="quote-text">“ 자주 묻는 질문 (FAQ) ”</div></div>
          <p>${formatBody(doc.faq)}</p>

          <p style="color:var(--primary); font-weight:700; margin-top:24px;">${escapeHtml(doc.hashtags || '')}</p>

          <!-- [출처 기능 추가] 해시태그 하단에 분리 렌더링 -->
          ${sourcesHtml}
        </div>

        <div class="toolbar">
          <button class="btn-copy" id="copy-btn">📋 본문 서식 전체 복사 (텍스트만)</button>
        </div>
      `;

      const cleanKw = (currentKeyword || '블로그').replace(/[^가-힣a-zA-Z0-9]/g, '_');
      document.getElementById('btn-dl-thumb').addEventListener('click', () => downloadImage(mainThumb, `${cleanKw}_썸네일.png`));
      document.getElementById('btn-dl-card1').addEventListener('click', () => downloadImage(cardImg1, `${cleanKw}_카드01.png`));
      document.getElementById('btn-dl-card2').addEventListener('click', () => downloadImage(cardImg2, `${cleanKw}_카드02.png`));
      document.getElementById('btn-dl-card3').addEventListener('click', () => downloadImage(cardImg3, `${cleanKw}_카드03.png`));

      document.getElementById('copy-btn').addEventListener('click', function() {
        const content = document.getElementById('blog-content');
        const range = document.createRange();
        range.selectNodeContents(content);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
        sel.removeAllRanges();
        alert("본문 텍스트가 복사되었습니다!\n네이버 블로그 에디터에 붙여넣으신 뒤 다운로드한 이미지를 삽입하세요.");
      });

      status.innerHTML = '';
    } catch (e) {
      status.innerHTML = `<div style="color:red; font-size:14px; text-align:center;">생성 오류: ${e.message}</div>`;
    } finally {
      btnGenerate.disabled = false;
    }
  }
</script>
</body>
</html>
